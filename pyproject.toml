[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prl-stratum-proxy"
version = "0.1.0"
description = "Local PRL Stratum routing with proof-preserving submission accounting"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
prl-proxy = "prl_proxy.app:main"

[tool.setuptools.packages.find]
include = ["prl_proxy*"]
